<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 日語回音法練習器 (Echo Method Japanese) - MP3 智慧自動斷句與口音對比</title>
  <meta name="description" content="專為日文學習者打造的「回音法 (Echo Method)」自動斷句特訓器。支援『來學日本語』等 MP3 音檔智慧音波切分、振假名注音、JSON 字卡匯入匯出與原音/錄音連續比對。">
  <link rel="stylesheet" href="styles.css">
  <style>
    .ja-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .status-box-ja {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      border-radius: var(--radius-md);
      background: rgba(225, 29, 72, 0.1);
      border: 1px solid rgba(225, 29, 72, 0.25);
      margin: 16px 0;
    }
    .status-text-ja {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f43f5e;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
    }
    .status-sub-ja {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .text-reveal-ja {
      margin-top: 16px;
      padding: 16px;
      background: rgba(16, 185, 129, 0.12);
      border-left: 4px solid var(--accent-green);
      border-radius: var(--radius-sm);
      width: 100%;
      display: none;
      text-align: left;
    }
    .text-reveal-ja ruby {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.8;
      color: var(--text-primary);
    }
    .text-reveal-ja rt {
      font-size: 0.8rem;
      color: var(--accent-cyan);
    }
    .text-reveal-ja .zh {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .compare-panel-ja {
      display: none;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-compare-ja {
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(37, 99, 235, 0.4);
      color: #60a5fa;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .btn-compare-ja:hover {
      background: rgba(37, 99, 235, 0.4);
      color: white;
    }
    .btn-compare-gold {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .btn-compare-gold:hover {
      background: rgba(245, 158, 11, 0.4);
      color: white;
    }
    .segment-item-ja {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--bg-card-border);
      font-size: 0.92rem;
      transition: var(--transition-fast);
    }
    .segment-active-ja {
      background: rgba(225, 29, 72, 0.15);
      border-radius: var(--radius-sm);
      border-left: 3px solid #f43f5e;
    }
    .tag-ja {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- SVG Icons Definitions -->
  <svg style="display: none;">
    <symbol id="icon-wave" viewBox="0 0 24 24">
      <path d="M2 12h2a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v10a2 2 0 0 0 4 0V5a2 2 0 0 1 4 0v10a2 2 0 0 0 2 2h2"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </symbol>
    <symbol id="icon-mic" viewBox="0 0 24 24">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
    </symbol>
    <symbol id="icon-history" viewBox="0 0 24 24">

      <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/>

  <div class="app-container">
    
    <!-- Navbar Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon" style="background: linear-gradient(135deg, #e11d48, #f43f5e);">
          <svg class="icon" style="width: 24px; height: 24px; color: white;"><use href="#icon-wave"/></svg>
        </div>
        <div>
          <h1 class="logo-title">🌸 日語回音法練習器</h1>
          <p style="font-size: 0.78rem; color: var(--text-muted);">『來學日本語』/ 教材 MP3 智慧自動斷句與發音比對</p>
        </div>
      </div>

      <div class="header-stats">
        <!-- Language Switcher Buttons -->
        <div style="display: flex; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: var(--radius-full); border: 1px solid var(--bg-card-border);">
          <a href="index.html" class="btn-secondary" style="border: none; padding: 6px 14px; text-decoration: none; font-size: 0.85rem;">🇬🇧 English 英文版</a>
          <a href="index_ja.html" class="btn-secondary active" style="background: #e11d48; color: white; border: none; padding: 6px 14px; text-decoration: none; font-size: 0.85rem;">🇯🇵 日本語 日文版</a>
        </div>

    </header>

    <main>
      <!-- Main Japanese Echo Core Card -->
      <section class="ja-card">
        <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
          <button class="btn-primary-glow" onclick="document.getElementById('audioFile').click()" style="flex: 1 1 200px; justify-content: center; background: linear-gradient(135deg, #e11d48, #f43f5e); cursor: pointer; min-height: 48px;">
            📁 選擇本機『來學日本語』MP3

          <button class="btn-secondary" id="btnCloudUrl" style="flex: 1 1 200px; justify-content: center; border-color: var(--accent-cyan); color: var(--accent-cyan); min-height: 48px;">

        <!-- 獨立隱藏 File Input -->
        <input type="file" id="audioFile" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.flac" style="display: none;">
        
        <!-- iPhone 1-Tap Quick Cloud Link Input Bar (免彈窗直接貼上) -->
        <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
          <input type="url" id="quickCloudUrl" class="form-input" placeholder="🔗 或在此直接貼上 Google Drive / 雲端網址" style="flex: 1; font-size: 0.82rem; padding: 10px 12px; margin: 0; min-height: 44px;">
          <button id="btnQuickCloud" class="btn-secondary" style="white-space: nowrap; border-color: var(--accent-cyan); color: var(--accent-cyan); font-weight: 600; min-height: 44px; padding: 0 16px;">☁️ 讀取網址</button>
        </div>

        <div id="audioInfo" style="font-size: 0.95rem; color: #38bdf8; text-align: center; margin-bottom: 16px; font-weight: 700; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px;">尚未選取音檔</div>

        <div class="status-box-ja">
          <div id="statusText" class="status-text-ja">請先選擇音檔</div>
          <div id="statusSub" class="status-sub-ja">載入後將透過 WebAudio 演算法自動進行靜音掃描斷句</div>

          <div id="textReveal" class="text-reveal-ja">
            <div id="revealJp"></div>
            <div id="revealZh" class="zh"></div>
          </div>

          <div id="comparePanel" class="compare-panel-ja">
            <button id="btnPlayOrigin" class="btn-compare-ja">🎧 聽原音</button>
            <button id="btnPlaySelf" class="btn-compare-ja">🎙️ 聽我的發音</button>
            <button id="btnCompareAll" class="btn-compare-ja btn-compare-gold">⚡ 連續對比 (原音+錄音)</button>
          </div>
        </div>

        <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
          <select id="repeatSelect" class="select-custom" style="flex: 1 1 180px; padding: 12px; font-size: 0.92rem;">
            <option value="1">單句練 1 次即跳下一句</option>
            <option value="2">單句重複練 2 次</option>
            <option value="3" selected>單句重複練 3 次</option>
          </select>
          <select id="speedSelectJa" class="select-custom" style="flex: 1 1 140px; padding: 12px; font-size: 0.92rem;">
            <option value="0.75">0.75x (慢速拆解音調)</option>
            <option value="1.0" selected>1.0x (標準速度)</option>
            <option value="1.25">1.25x (快速挑戰)</option>
          </select>
        </div>

        <button id="btnStart" class="btn-primary-glow" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #e11d48, #f43f5e);" disabled>
          ▶️ 開始 4 步驟迴音訓練
        </button>
        <button id="btnStop" class="btn-secondary" style="width: 100%; justify-content: center; margin-top: 10px; display: none; border-color: #ef4444; color: #ef4444;">
          ⏸️ 暫停訓練
        </button>

        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button id="btnExport" class="btn-secondary" style="flex: 1; justify-content: center;">💾 匯出字卡 (JSON)</button>
          <label class="btn-secondary" for="jsonFile" style="flex: 1; justify-content: center; cursor: pointer;">📥 匯入字卡</label>
          <input type="file" id="jsonFile" accept=".json,application/json,text/plain" style="display: none;">
        </div>
      </section>

      <!-- Segment List Card -->
      <section class="ja-card">
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span>🎵 斷句列表與練習勾選</span>
            <span style="font-size: 0.85rem; color: var(--accent-cyan);" id="segCountText">共 0 句</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="selectAllSegs(true)">☑️ 全選練習</button>
            <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="selectAllSegs(false)">☐ 全不選</button>
          </div>
        </div>
        <div id="segmentList"></div>
      </section>
    </main>
  </div>

  <!-- Cloud URL Modal -->
  <div class="modal-overlay" id="cloudModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-family: var(--font-heading); font-size: 1.2rem;">☁️ 載入雲端音檔網址</h3>
        <button class="btn-icon-close" id="btnCancelCloud">&times;</button>
      </div>
      <div class="form-group">
        <label>貼上雲端音檔連結 (支援 Google Drive 分享連結、Dropbox 或 MP3 直連網址)</label>
        <input type="text" class="form-input" id="cloudUrlInput" placeholder="例如：https://drive.google.com/file/d/1ABC.../view">
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 6px;">
          💡 小撇步：若使用 Google Drive，請確保檔案已設為「知道連結的人皆可存取」。
        </p>
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
        <button id="btnFetchCloud" class="btn-primary-glow" style="padding: 10px 24px; background: linear-gradient(135deg, #06b6d4, #3b82f6);">讀取雲端音檔</button>
      </div>
    </div>
  </div>

  <!-- Edit Text Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-family: var(--font-heading); font-size: 1.2rem;">標註段落文字</h3>
        <button class="btn-icon-close" id="btnCancelModal">&times;</button>
      </div>
      <div class="form-group">
        <label>日語 (支援 &lt;ruby&gt;振假名&lt;/ruby&gt; 格式)</label>
        <textarea class="form-textarea" id="editJp" rows="3" placeholder="例如：<ruby>初<rt>はじ</rt></ruby>めまして"></textarea>
      </div>
      <div class="form-group">
        <label>中文翻譯</label>
        <input type="text" class="form-input" id="editZh" placeholder="例如：初次見面">
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
        <button id="btnSaveModal" class="btn-primary-glow" style="padding: 10px 24px; background: linear-gradient(135deg, #e11d48, #f43f5e);">儲存標註</button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>
  <audio id="selfPlayer"></audio>

  <script>
    let segments = [], currentIdx = 0, currentLoop = 1, isTraining = false;
    let audioBuffer = null, rawAudioFile = null;
    let mediaRecorder = null, recordedChunks = [], userVoiceBlob = null;
    let editingIdx = null;

    const player = document.getElementById('audioPlayer');
    const selfPlayer = document.getElementById('selfPlayer');
    const statusText = document.getElementById('statusText');
    const statusSub = document.getElementById('statusSub');
    const textReveal = document.getElementById('textReveal');
    const revealJp = document.getElementById('revealJp');
    const revealZh = document.getElementById('revealZh');
    const comparePanel = document.getElementById('comparePanel');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');

    // 1. 本機音檔選擇事件
    const audioFileInput = document.getElementById('audioFile');
    audioFileInput.onchange = function(e) {
      const file = e.target.files && e.target.files[0];
      const audioInfo = document.getElementById('audioInfo');
      const statusText = document.getElementById('statusText');
      const statusSub = document.getElementById('statusSub');
      const btnStart = document.getElementById('btnStart');

      if (!file) {
        audioInfo.innerHTML = "❌ 尚未讀取到檔案";
        return;
      }

      // 第一毫秒立即同步呈現 UI 反饋與解鎖按鈕
      rawAudioFile = file;
      audioInfo.innerHTML = "🟢 <b>已成功選取音檔：</b> " + file.name + " (" + (file.size / (1024 * 1024)).toFixed(1) + " MB)";
      statusText.innerText = "⏳ 正在處理音檔，準備開始...";
      statusSub.innerText = "按鈕已解鎖，隨時可點擊「開始 4 步驟迴音訓練」";
      btnStart.disabled = false;
      btnStart.removeAttribute('disabled');

      try {
        const objectUrl = URL.createObjectURL(file);
        player.src = objectUrl;
        player.load();
      } catch (err) {
        console.warn("Blob URL 建立警告:", err);
      }

      // 異步波形脈衝斷句
      setTimeout(async () => {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContextClass();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          detectSilence(audioBuffer);

          if (!segments || segments.length === 0) {
            createDefaultSegments(audioBuffer.duration);
          }
          statusText.innerText = "✅ 自動斷句完成 (共 " + segments.length + " 句)，可開始特訓！";
          renderList();
        } catch (err) {
          console.warn("WebAudio 自動斷句受限，進入標準播放模式", err);
          createDefaultSegments(player.duration || 12);
          statusText.innerText = "✅ 音檔載入完成，點擊開始特訓！";
          renderList();
        }
      }, 100);
    };

    function createDefaultSegments(duration) {
      if (!duration || duration <= 0) duration = 12;
      segments = [];
      let start = 0;
      while (start < duration) {
        let end = Math.min(duration, start + 4.0);
        segments.push({ start, end, jp: "", zh: "", selected: true });
        start = end;
      }
      renderList();
    }

    function detectSilence(buffer) {
      const data = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      const step = 0.05, threshold = 0.015, minSilence = 0.55;
      let inSpeech = false, start = 0, silenceDuration = 0;
      segments = [];

      for (let t = 0; t < buffer.duration; t += step) {
        let sum = 0, count = 0;
        for (let i = Math.floor(t * sampleRate); i < Math.floor((t + step) * sampleRate) && i < data.length; i++) {
          sum += Math.abs(data[i]);
          count++;
        }
        const amp = count ? sum / count : 0;
        if (amp > threshold) {
          if (!inSpeech) { inSpeech = true; start = Math.max(0, t - 0.1); }
          silenceDuration = 0;
        } else {
          if (inSpeech) {
            silenceDuration += step;
            if (silenceDuration >= minSilence) {
              inSpeech = false;
              let end = t - silenceDuration + 0.2;
              if (end - start > 0.8) segments.push({ start, end, jp: "", zh: "", selected: true });
            }
          }
        }
      }
      if (inSpeech && buffer.duration - start > 0.8) {
        segments.push({ start, end: buffer.duration, jp: "", zh: "", selected: true });
      }
      renderList();
    }

    function renderList() {
      const list = document.getElementById('segmentList');
      list.innerHTML = "";
      let selectedCount = 0;

      segments.forEach((seg, i) => {
        const isSelected = seg.selected !== false;
        if (isSelected) selectedCount++;
        const dur = (seg.end - seg.start).toFixed(1);

        const div = document.createElement('div');
        div.className = `segment-item-ja ${i === currentIdx && isTraining ? 'segment-active-ja' : ''}`;
        div.style.opacity = isSelected ? "1" : "0.45";
        div.style.background = isSelected ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.2)";
        div.style.borderRadius = "8px";
        div.style.margin = "8px 0";
        div.style.padding = "10px 14px";
        div.style.border = isSelected ? "1px solid rgba(255,255,255,0.08)" : "1px dashed rgba(255,255,255,0.1)";

        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; width: 100%;">
            <div style="display: flex; align-items: center; gap: 10px; flex: 1 1 220px;">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${i})" style="width: 20px; height: 20px; cursor: pointer; accent-color: #f43f5e;" title="勾選是否練習此句">
              <div>
                <div>
                  <strong>第 ${i + 1} 句</strong>
                  <span class="tag-ja">${seg.start.toFixed(1)}s - ${seg.end.toFixed(1)}s (${dur}s)</span>
                  ${isSelected ? '<span style="font-size:0.75rem; color:#4ade80; margin-left:4px;">[練習]</span>' : '<span style="font-size:0.75rem; color:#94a3b8; margin-left:4px;">[略過]</span>'}
                </div>
                <div style="font-size: 0.88rem; color: #cbd5e1; margin-top: 4px;">${seg.jp || '<span style="color:var(--text-muted);">(尚未設定文字/注音)</span>'}</div>
              </div>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
              <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" onclick="playPreview(${i})" title="試聽此句">▶️ 試聽</button>
              <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" onclick="openEdit(${i})" title="編輯文字">✏️ 編輯</button>
              <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" onclick="splitSeg(${i})" title="對半分割此句">✂️ 分割</button>
              ${i < segments.length - 1 ? `<button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" onclick="mergeSeg(${i})" title="與下一句合併">🔗 合併</button>` : ''}
              <button class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem; color: #f87171; border-color: rgba(248,113,113,0.3);" onclick="deleteSeg(${i})" title="刪除此句">🗑️ 刪除</button>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
      document.getElementById('segCountText').innerText = `已勾選 ${selectedCount} / 共 ${segments.length} 句`;
    }

    window.toggleSelect = (i) => {
      segments[i].selected = segments[i].selected === false ? true : false;
      renderList();
    };

    window.selectAllSegs = (flag) => {
      segments.forEach(s => s.selected = flag);
      renderList();
    };

    window.playPreview = (i) => {
      const seg = segments[i];
      player.currentTime = seg.start;
      player.play();
      const dur = (seg.end - seg.start) * 1000;
      setTimeout(() => player.pause(), dur);
    };

    window.splitSeg = (i) => {
      const seg = segments[i];
      const dur = seg.end - seg.start;
      if (dur < 0.6) {
        alert("⚠️ 該句長度過短 (小於 0.6 秒)，無法再分割！");
        return;
      }
      const mid = parseFloat(((seg.start + seg.end) / 2).toFixed(2));
      const seg1 = { start: seg.start, end: mid, jp: seg.jp || '', zh: seg.zh || '', selected: seg.selected !== false };
      const seg2 = { start: mid, end: seg.end, jp: '', zh: '', selected: seg.selected !== false };
      segments.splice(i, 1, seg1, seg2);
      renderList();
    };

    window.mergeSeg = (i) => {
      if (i >= segments.length - 1) return;
      segments[i].end = segments[i + 1].end;
      if (segments[i + 1].jp) segments[i].jp = (segments[i].jp ? segments[i].jp + " " : "") + segments[i + 1].jp;
      if (segments[i + 1].zh) segments[i].zh = (segments[i].zh ? segments[i].zh + " " : "") + segments[i + 1].zh;
      segments.splice(i + 1, 1);
      renderList();
    };

    window.deleteSeg = (i) => {
      if (segments.length <= 1) {
        alert("⚠️ 至少需保留 1 句段落！");
        return;
      }
      segments.splice(i, 1);
      renderList();
    };

    // 2. 回音法核心訓練排程
    btnStart.onclick = async () => {
      const activeSegs = segments.filter(s => s.selected !== false);
      if (activeSegs.length === 0) {
        alert("⚠️ 請至少勾選 1 句段落進行練習！");
        return;
      }
      isTraining = true;
      currentIdx = 0;
      currentLoop = 1;
      btnStart.style.display = "none";
      btnStop.style.display = "block";
      await initMic();
      runEchoLoop();
    };

    btnStop.onclick = () => {
      isTraining = false;
      player.pause();
      selfPlayer.pause();
      stopMic();
      btnStart.style.display = "block";
      btnStop.style.display = "none";
      statusText.innerText = "練習已暫停";
      statusSub.innerText = "";
    };

    async function initMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        let mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported('audio/webm') && MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        }
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          userVoiceBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
          selfPlayer.src = URL.createObjectURL(userVoiceBlob);
        };
      } catch (e) {
        console.warn("麥克風存取失敗", e);
      }
    }

    function stopMic() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    async function runEchoLoop() {
      while (currentIdx < segments.length && segments[currentIdx].selected === false) {
        currentIdx++;
      }

      if (!isTraining || currentIdx >= segments.length) {
        statusText.innerText = "🎉 已完成所有已勾選句子的日文特訓！功力大增！";
        btnStop.click();
        return;
      }

      renderList();
      const seg = segments[currentIdx];
      const maxLoop = parseInt(document.getElementById('repeatSelect').value);

      // 階段 1：盲聽原音
      textReveal.style.display = "none";
      comparePanel.style.display = "none";
      statusText.innerText = `🎧 聽日語原音 (第 ${currentIdx + 1} 句 - 第 ${currentLoop}/${maxLoop} 次)`;
      statusSub.innerText = "耳朵專注捕捉語音高低音調 (Pitch Accent) 與節奏起伏";

      player.currentTime = seg.start;
      player.playbackRate = parseFloat(document.getElementById('speedSelectJa').value) || 1.0;
      player.play();

      const speed = parseFloat(document.getElementById('speedSelectJa').value) || 1.0;
      const duration = ((seg.end - seg.start) / speed) * 1000;
      setTimeout(() => {
        if (!isTraining) return;
        player.pause();

        // 階段 2：強制留白 2 秒 (Mental Echo)
        statusText.innerText = "🧠 腦中日文迴音中...";
        statusSub.innerText = "閉上嘴巴，讓剛才的聲調在腦袋大腦皮層自然重播";

        setTimeout(() => {
          if (!isTraining) return;

          // 階段 3：開口模仿 + 同步錄音
          statusText.innerText = "🗣️ 換你開口模仿！";
          statusSub.innerText = "依據剛才的大腦心像大聲模仿發音（麥克風錄音中）";
          recordedChunks = [];
          if (mediaRecorder && mediaRecorder.state === 'inactive') mediaRecorder.start();

          const mimicTime = Math.max(3000, duration + 1000);
          setTimeout(() => {
            if (!isTraining) return;
            stopMic();

            // 階段 4：答案揭曉與對比
            statusText.innerText = "✅ 句子校對與發音比對";
            statusSub.innerText = "檢查振假名文字，並可點擊按鈕對比原音與自己的錄音";
            if (seg.jp || seg.zh) {
              revealJp.innerHTML = seg.jp;
              revealZh.innerText = seg.zh;
              textReveal.style.display = "block";
            }
            comparePanel.style.display = "flex";

            // 下一輪或下一句排程
            setTimeout(() => {
              if (!isTraining) return;
              if (currentLoop < maxLoop) {
                currentLoop++;
              } else {
                currentLoop = 1;
                currentIdx++;
              }
              runEchoLoop();
            }, 4500); // 留 4.5 秒供查看文字與自選比對
          }, mimicTime);
        }, 2000);
      }, duration);
    }

    // 3. 對比播放按鈕行為
    document.getElementById('btnPlayOrigin').onclick = () => {
      player.currentTime = segments[currentIdx].start;
      player.play();
      setTimeout(() => player.pause(), (segments[currentIdx].end - segments[currentIdx].start) * 1000);
    };
    document.getElementById('btnPlaySelf').onclick = () => selfPlayer.play();
    document.getElementById('btnCompareAll').onclick = () => {
      player.currentTime = segments[currentIdx].start;
      player.play();
      setTimeout(() => {
        player.pause();
        setTimeout(() => selfPlayer.play(), 400);
      }, (segments[currentIdx].end - segments[currentIdx].start) * 1000);
    };

    // 4. 文字編輯視窗
    window.openEdit = (i) => {
      editingIdx = i;
      document.getElementById('editJp').value = segments[i].jp;
      document.getElementById('editZh').value = segments[i].zh;
      document.getElementById('editModal').classList.add('open');
    };
    document.getElementById('btnCancelModal').onclick = () => document.getElementById('editModal').classList.remove('open');
    document.getElementById('btnSaveModal').onclick = () => {
      segments[editingIdx].jp = document.getElementById('editJp').value;
      segments[editingIdx].zh = document.getElementById('editZh').value;
      document.getElementById('editModal').classList.remove('open');
      renderList();
    };

    // 5. 字卡 JSON 匯出與匯入
    document.getElementById('btnExport').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(segments, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = (rawAudioFile ? rawAudioFile.name.replace(/\.[^/.]+$/, "") : "日文回音字卡") + ".json";
      a.click();
    };
    document.getElementById('jsonFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        segments = JSON.parse(evt.target.result);
        document.getElementById('segCountText').innerText = `共 ${segments.length} 句`;
        renderList();
        alert("🎉 日文字卡 JSON 匯入成功！");
      };
      reader.readAsText(file);
    };
    // 6. 雲端音檔網址讀取 (Google Drive / Dropbox / 直連網址)
    const parseGoogleDriveId = (url) => {
      const m1 = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m1) return m1[1];
      const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m2) return m2[1];
      const m3 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m3) return m3[1];
      return null;
    };

    const loadCloudUrl = async (rawUrl) => {
      let url = rawUrl.trim();
      if (!url) return;

      const fileId = parseGoogleDriveId(url);
      if (fileId) {
        // 使用 Google 高速 CDN 直連網址
        url = `https://lh3.googleusercontent.com/d/${fileId}`;
      } else if (url.includes('dropbox.com')) {
        url = url.replace('dl=0', 'raw=1').replace('www.dropbox.com', 'dl.dropboxusercontent.com');
      }

      document.getElementById('audioInfo').innerHTML = "☁️ <b>已載入雲端音檔連結：</b><br><span style='font-size:0.75rem; word-break:break-all; color:#94a3b8;'>" + rawUrl + "</span>";
      player.src = url;
      player.load();
      statusText.innerText = "⏳ 正在連接雲端串流音檔...";
      statusSub.innerText = "如為 Google Drive 連結，請確認已開啟「知道連結的任何人」共用權限";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP Status " + response.status);
        const arrayBuffer = await response.arrayBuffer();
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContextClass();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        detectSilence(audioBuffer);
        statusText.innerText = "✅ 雲端音檔下載與斷句完成！";
        btnStart.disabled = false;
        renderList();
      } catch (err) {
        console.warn("CORS 限制無法讀取二進位波形，已轉為標準串流播放模式", err);
        statusText.innerText = "✅ 雲端音檔已連線，點擊開始特訓！";
        statusSub.innerText = "提示：若播放無聲音，請確定 Drive 共用權限設為「知道連結的人皆可檢視」";
        btnStart.disabled = false;
      }
    };

    document.getElementById('btnQuickCloud').onclick = () => {
      const url = document.getElementById('quickCloudUrl').value;
      if (!url) {
        alert('請先貼上 Google Drive 或音檔網址！');
        return;
      }
      loadCloudUrl(url);
    };

    document.getElementById('btnCloudUrl').onclick = () => {
      document.getElementById('cloudModal').classList.add('open');
    };
    document.getElementById('btnCancelCloud').onclick = () => {
      document.getElementById('cloudModal').classList.remove('open');
    };

    document.getElementById('btnFetchCloud').onclick = () => {
      let url = document.getElementById('cloudUrlInput').value.trim();
      document.getElementById('cloudModal').classList.remove('open');
      loadCloudUrl(url);
    };
  </script>
</body>
</html>
